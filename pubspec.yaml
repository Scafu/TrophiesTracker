name: trophies_tracker
description: "A game trophies tracking app, that sync your favourite platform all together."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.32.0
  path_provider: ^2.1.5
  get_it: ^9.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.4
  go_router: ^17.1.0
  flutter_bloc: ^9.1.1
  logger: ^2.6.2
  google_fonts: ^8.0.2
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  equatable: ^2.0.8
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  material_symbols_icons: ^4.2906.0
  rxdart: ^0.28.0
  collection: ^1.19.1
  cached_network_image: ^3.4.1
  json_annotation: ^4.11.0
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.24
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
dev_dependencies:
  drift_dev: ^2.32.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.12.2
  freezed: ^3.0.0
  json_serializable: ^6.0.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/


