android_signing:
  - keystore_reference: CM_KEYSTORE  # Questo corrisponde al nome del keystore caricato
    # NON usare $ qui - Codemagic risolve automaticamente dal gruppo
    keystore_password: CM_KEYSTORE_PASSWORD  
    key_alias: CM_KEY_ALIAS
    key_password: CM_KEY_PASSWORD

workflows:
  
  app_build:
    name: Trophies Tracker
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - CM_KEYSTORE
      vars:
        GITHUB_TOKEN: $GITHUB_TOKEN

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
     
      - name: Get dependencies
        script: |
          flutter pub get
      
      - name: Analyze project
        script: |
          flutter analyze
      
      - name: Build APK
        script: |
          flutter build apk --release
      
      - name: Set up key properties
        script: |
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      
      - name: Build AppBundle
        script: |
          flutter build appbundle --release
      
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
      
      - name: Extract version
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD=$(grep '^version:' pubspec.yaml | cut -d '+' -f 2)
          
          echo "VERSION=$VERSION" >> $CM_ENV
          echo "BUILD=$BUILD" >> $CM_ENV
          echo "TAG=v$VERSION" >> $CM_ENV
          
          echo "📦 Version: $VERSION"
          echo "🔢 Build: $BUILD"
      
      - name: Generate changelog
        script: |
          cat > changelog.md <<EOF
          ## Trophies Tracker ${VERSION}
          
          ### 📱 Build Info
          - Version: ${VERSION}
          - Build: ${BUILD}
          - Build Date: $(date '+%Y-%m-%d %H:%M:%S')
          - Commit: ${CM_COMMIT}
          
          ### 📦 Download
          - **Android APK**: trophies-tracker-${VERSION}.apk
          - **Android Bundle**: trophies-tracker-${VERSION}.aab
          
          ### 🔄 Changes
          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD || echo "- Initial release")
          EOF
      
      - name: Create GitHub Tag and Release
        script: | 
          #!/usr/bin/env bash
          set -e
           
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "❌ GITHUB_TOKEN not set"
            exit 1
          fi
          
          # Configura Git
          git config --global user.email "codemagic@build.com"
          git config --global user.name "Codemagic CI"
           
          # NON serve gh auth login - GITHUB_TOKEN è già nell'environment 
          # gh usa automaticamente la variabile d'ambiente
          
          # Verifica autenticazione
          gh auth status || {
            echo "⚠️  Auth status check failed, but continuing..."
          }
          
          # Verifica se il tag esiste già
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $TAG already exists, deleting old release..."
            gh release delete "$TAG" --yes --repo "${CM_REPO_SLUG}" || true
            git tag -d "$TAG" || true
            git push https://${GITHUB_TOKEN}@github.com/${CM_REPO_SLUG}.git :refs/tags/"$TAG" || true
          fi
          
          # Crea il tag localmente
          git tag -a "$TAG" -m "Release $TAG - Build $BUILD"
          
          # Pusha il tag su GitHub
          git push https://${GITHUB_TOKEN}@github.com/${CM_REPO_SLUG}.git "$TAG"
          
          echo "✅ Tag $TAG created and pushed"
          
          # Path agli artifact
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          
          # Rinomina i file
          cp "$APK_PATH" "trophies-tracker-${VERSION}.apk"
          cp "$AAB_PATH" "trophies-tracker-${VERSION}.aab"
          
          # Crea la release su GitHub
          gh release create "$TAG" \
            --repo "${CM_REPO_SLUG}" \
            --title "Trophies Tracker ${VERSION}" \
            --notes-file changelog.md \
            "trophies-tracker-${VERSION}.apk" \
            "trophies-tracker-${VERSION}.aab"
          
          echo "🎉 Release $TAG published!"
          echo "📍 https://github.com/${CM_REPO_SLUG}/releases/tag/${TAG}"
            
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/iphoneos/*.app
      - trophies-tracker-*.apk
      - trophies-tracker-*.aab